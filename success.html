<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Complete - Section23 Vault</title>
    
    <!-- 🎛️ LOADING SPINNER DESIGN STYLES -->
    <style>
        .spinner-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            gap: 15px;
            font-family: monospace;
        }

        .loader-ring {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(46, 196, 182, 0.1);
            border-top: 4px solid #2ec4b6;
            border-radius: 50%;
            animation: vinylSpin 1s linear infinite;
            box-shadow: 0 0 15px rgba(46, 196, 182, 0.4);
        }

        @keyframes vinylSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            color: #2ec4b6;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body style="background: #121212; color: #fff; font-family: sans-serif;">

<div class="main-content" style="max-width: 600px; margin: 50px auto; text-align: center; padding: 20px;">
    
    <h1 style="color: #2ec4b6;">🏛️ Transaction Complete</h1>
    <p>Your payment has cleared the secure Stripe till. Your premium high-fidelity file is unlocked below.</p>

    <!-- Dynamic Target Download Card Frame Container -->
    <div id="redemption-station" class="record-card" style="position: relative; margin: 30px auto; padding: 20px; border: 2px dashed #2ec4b6; background: #1a1a1a; display: none; flex-direction: column; align-items: center; border-radius: 8px;">
        
        <!-- 🌀 THE VISUAL SPINNER OVERLAY HOUSING -->
        <div id="processing-loader" class="spinner-overlay">
            <div class="loader-ring"></div>
            <div id="loader-status-text" class="spinner-text">Decoding Matrix...</div>
        </div>

        <!-- Spinning Label Artwork Panel -->
        <div style="margin-bottom: 15px;">
            <img id="redeemed-artwork" src="assets/default.jpg" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover;" alt="Record sleeve">
        </div>

        <small id="redeemed-id" style="color: #ff9f1c; font-family: monospace; font-size: 1rem;"></small>
        <h2 id="redeemed-title" style="margin: 10px 0 5px 0; color: #fff;"></h2>
        <p id="redeemed-format" style="font-style: italic; color: #888; margin-bottom: 20px;"></p>

        <!-- Invisible audio stream container for wav-extractor2.js -->
        <audio id="redeemed-audio-element" style="display: none;"></audio>

        <!-- 📥 THE LIVE CONVERSION & DOWNLOAD TRIGGER BUTTON -->
        <button id="direct-download-trigger" style="display: block; width: 100%; padding: 15px; background: #2ec4b6; color: #fff; border: none; font-size: 1rem; font-weight: bold; border-radius: 4px; text-transform: uppercase; margin-bottom: 15px; cursor: pointer;">
            📥 Convert & Download Pristine WAV
        </button>
    </div>

    <!-- 🛒 Navigation Return Route link -->
    <div style="margin-top: 40px; border-top: 1px dashed #333; padding-top: 20px;">
        <a href="index.html" style="color: #ff9f1c; text-decoration: none; font-weight: bold; font-family: monospace; text-transform: uppercase;">
            🛒 Continue Crate-Digging (Return to Shop Floor)
        </a>
    </div>
</div>

<!-- Scripts Dependency Chain -->
<script src="wav-extractor2.js"></script>
<script src="success.js"></script>

</body>
</html>
